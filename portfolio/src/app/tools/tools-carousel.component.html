<section id="tools" class="tools-section py-12 px-4">
    <div class="max-w-6xl mx-auto">
        <div class="mb-6 text-center">
            <h2 class="text-2xl sm:text-3xl font-semibold tracking-tight">{{ 'tools.title' | translate }}</h2>
        </div>

        <div #carousel
            class="carousel-viewport overflow-hidden rounded-[2rem] border border-white/10 bg-slate-950/60 shadow-[0_30px_80px_rgba(15,23,42,0.45)]"
            (mouseenter)="pauseAutoScroll()" (mouseleave)="resumeAutoScroll()">
            <div class="track flex gap-4 px-4 py-6" *ngIf="displayTools.length">
                <article *ngFor="let tool of displayTools" class="tool-item flex-none min-w-[9rem] sm:min-w-[10.5rem]">
                    <div class="tool-icon">
                        <img [src]="tool.icon" [alt]="tool.name + ' logo'" class="tool-svg" loading="lazy" />
                    </div>
                    <p class="tool-name">{{ tool.name }}</p>
                </article>
            </div>
        </div>
    </div>
</section>
