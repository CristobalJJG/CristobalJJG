<section id="projects" class="py-20 px-4">
  <div class="max-w-6xl mx-auto">
    <h2 class="text-3xl sm:text-4xl font-bold mb-10 text-center">{{ 'projects.title' | translate }}</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 sm:gap-8">
      @for (project of projects; track project) {
        <app-card [title]="project.titleKey | translate"
          [image]="project.image" [description]="project.descriptionKey | translate" [width]="'m'"
          [height]="'l'">
          <div class="mt-auto flex flex-wrap gap-3 pt-2">
            <a [href]="project.githubUrl" target="_blank" rel="noopener noreferrer"
              class="rounded-full border border-white/15 px-4 py-2 text-sm transition hover:border-blue-400 hover:text-blue-300">
              {{ 'projects.github' | translate }}
            </a>
            <a [href]="project.pageUrl" target="_blank" rel="noopener noreferrer"
              class="rounded-full bg-blue-500/20 px-4 py-2 text-sm transition hover:bg-blue-500/30 hover:text-blue-200">
              {{ 'projects.page' | translate }}
            </a>
          </div>
        </app-card>
      }
    </div>
  </div>
</section>
