<section id="projects" class="py-20 px-4">
    <div class="max-w-6xl mx-auto">
        <h2 class="text-3xl sm:text-4xl font-bold mb-10 text-center">{{ 'projects.title' | translate }}</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
            <app-card *ngFor="let project of projects" [title]="project.titleKey | translate"
                [description]="project.descriptionKey | translate" [width]="'l'" [height]="'m'"></app-card>
        </div>
    </div>
</section>
