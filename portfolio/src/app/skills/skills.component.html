<section id="skills" class="py-20 px-4">
    <div class="max-w-6xl mx-auto">
        <h2 class="text-3xl sm:text-4xl font-bold mb-10 text-center">{{ 'skills.title' | translate }}</h2>
        <div class="grid grid-cols-2 justify-items-center gap-4  sm:gap-6 lg:grid-cols-3 lg:gap-8">
            <div *ngFor="let skill of skills"
                class="glass-card glass-dark card p-2 sm:p-4 hover:scale-105 transition-all duration-300 flex flex-col items-center justify-center w-full max-w-[12rem] sm:max-w-sm gap-2 sm:gap-3">

                <!-- Skill Icon Container -->
                <div
                    class="icon-wrapper flex items-center justify-center p-3 sm:p-4 bg-slate-900/60 rounded-2xl border border-white/5 shadow-inner">
                    <ng-container [ngSwitch]="skill.nameKey">
                        <!-- Odoo -->
                        <svg *ngSwitchCase="'skill.odoo'" viewBox="0 0 24 24" fill="none" stroke-width="1.5"
                            stroke-linecap="round" stroke-linejoin="round"
                            class="w-10 h-10 sm:w-12 sm:h-12 filter drop-shadow-[0_0_8px_rgba(113,75,103,0.4)]">
                            <!-- First 'o' in Odoo purple -->
                            <circle cx="4" cy="13" r="2.5" stroke="#714B67" />
                            <!-- 'd' in gray -->
                            <circle cx="9.5" cy="13" r="2.5" stroke="#8F8F8F" />
                            <path d="M12 7.5v8" stroke="#8F8F8F" />
                            <!-- Third 'o' in gray -->
                            <circle cx="15" cy="13" r="2.5" stroke="#8F8F8F" />
                            <!-- Fourth 'o' in gray -->
                            <circle cx="20.5" cy="13" r="2.5" stroke="#8F8F8F" />
                        </svg>

                        <!-- Angular -->
                        <svg *ngSwitchCase="'skill.angular'" viewBox="0 0 24 24" fill="none" stroke-width="1.5"
                            stroke-linecap="round" stroke-linejoin="round"
                            class="w-10 h-10 sm:w-12 sm:h-12 filter drop-shadow-[0_0_8px_rgba(226,50,55,0.4)]">
                            <!-- Shield outline in red -->
                            <path d="M12 2L3 5.5l1.5 11.5 7.5 5 7.5-5 1.5-11.5z" stroke="#E23237" />
                            <!-- A as actual text -->
                            <text x="12" y="16.5" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif"
                                font-weight="900" font-size="14.5" text-anchor="middle">A</text>
                        </svg>

                        <!-- TypeScript -->
                        <svg *ngSwitchCase="'skill.typescript'" viewBox="0 0 24 24" fill="none" stroke-width="1.5"
                            stroke-linecap="round" stroke-linejoin="round"
                            class="w-10 h-10 sm:w-12 sm:h-12 filter drop-shadow-[0_0_8px_rgba(49,120,198,0.4)]">
                            <!-- Square outline in TS blue -->
                            <rect x="3" y="3" width="18" height="18" rx="2" stroke="#3178C6" />
                            <!-- TS as actual text -->
                            <text x="19.5" y="19.5" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif"
                                font-weight="bold" font-size="8.5" text-anchor="end">TS</text>
                        </svg>

                        <!-- Databases -->
                        <svg *ngSwitchCase="'skill.databases'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                            class="w-10 h-10 sm:w-12 sm:h-12 text-emerald-400 filter drop-shadow-[0_0_8px_rgba(52,211,153,0.5)]">
                            <ellipse cx="12" cy="5" rx="9" ry="3" />
                            <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" />
                            <path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3" />
                        </svg>

                        <!-- Responsive -->
                        <svg *ngSwitchCase="'skill.responsive'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                            class="w-10 h-10 sm:w-12 sm:h-12 text-pink-400 filter drop-shadow-[0_0_8px_rgba(244,114,182,0.5)]">
                            <rect x="3" y="4" width="11" height="9" rx="1" />
                            <rect x="10" y="9" width="11" height="11" rx="1" />
                            <line x1="8.5" y1="13" x2="8.5" y2="13.01" />
                            <line x1="15.5" y1="18" x2="15.5" y2="18.01" />
                        </svg>

                        <!-- Performance -->
                        <svg *ngSwitchCase="'skill.performance'" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                            class="w-10 h-10 sm:w-12 sm:h-12 text-amber-400 filter drop-shadow-[0_0_8px_rgba(251,191,36,0.5)]">
                            <path d="M12 2a10 10 0 0 0-10 10c0 5.52 4.48 10 10 10s10-4.48 10-10" />
                            <path d="M12 2a10 10 0 0 1 10 10" stroke-dasharray="3 3" />
                            <path d="M12 12l6-6" />
                            <circle cx="12" cy="12" r="1.5" />
                        </svg>
                    </ng-container>
                </div>

                <!-- Skill Name -->
                <span class="name text-center text-lg font-semibold tracking-wide">{{ skill.nameKey | translate
                    }}</span>

            </div>
        </div>
    </div>
</section>
