<div [class]="'glass-card p-4 flex flex-col gap-3 ' + sizeClass">
  @if (image && !imageFailed) {
    <div class="h-40 overflow-hidden rounded-md bg-slate-800/70">
      <img [src]="image" [alt]="title || ''" class="h-full w-full object-cover" loading="lazy" decoding="async"
        (error)="onImageError()" />
      </div>
    } @else {
      <div role="img" [attr.aria-label]="title"
        class="flex h-40 items-center justify-center rounded-md bg-gradient-to-br from-blue-500/10 to-purple-500/10 text-white/30">
        <svg aria-hidden="true" focusable="false" class="h-10 w-10" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <path d="m21 15-5-5L5 21"></path>
        </svg>
      </div>
    }
    @if (title) {
      <h3 class="text-xl font-semibold">{{ title }}</h3>
    }
    @if (description) {
      <p class="text-sm text-gray-300">{{ description }}</p>
    }
    <ng-content></ng-content>
  </div>
